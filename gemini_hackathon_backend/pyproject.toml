[project]
name = "gemini-hackathon-backend"
version = "0.1.0"
description = "ADK 2 FastAPI backend for the British Isles Journey. Hosts the AG-UI bridge + A2UI JSONL streaming."
requires-python = ">=3.11"

dependencies = [
    # ADK + Gemini (matches what's already pinned in ../pyproject.toml)
    "google-adk>=2.7.1,<3.0",
    "google-genai",
    # AG-UI bridge (the new dependency for the journey)
    "ag-ui-adk",
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    # State (Phase 6 abstractions — reuse, don't re-implement)
    "google-cloud-firestore",
    # Embeddings (matches the journey's existing VertexEmbedder)
    "google-cloud-aiplatform",
    "google-cloud-storage",
    # Config
    "python-dotenv",
    "pydantic",
    # Observability — Langfuse + MLflow + OpenInference + OTel GCP exporters.
    # All env-gated; degrade to structlog-only when their env vars are unset
    # (see gemini_hackathon_backend/observability.py).
    "structlog>=24.0",
    "langfuse>=2.40,<4.0",
    "mlflow>=2.20,<3.0",
    # Phase 1: ADK-native OTel pipeline + OpenInference Langfuse instrumentor.
    # Auto-streams every ADK span to Cloud Trace + Cloud Logging under the
    # OpenTelemetry GenAI semantic conventions.
    "openinference-instrumentation-google-adk>=0.1.0",
    "opentelemetry-exporter-gcp-trace>=1.9.0",
    "opentelemetry-exporter-gcp-logging>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gemini_hackathon_backend"]
