# Cloud Build pipeline for Anam Oideachais — 7-Feature Integration Studio.
# Auto-generated by gemini_hackathon_gradio._common.cloud_run_deploy.
#
# Submit:
#   gcloud builds submit --config=gemini_hackathon_gradio/anam_education/cloudbuild.cloudrun.yaml \
#     --substitutions=_REGION=europe-west1,_IMAGE_URL=IMAGE_URL

steps:
  - name: "gcr.io/cloud-builders/docker:latest"
    id: "build"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$_IMAGE_URL" \
          -f gemini_hackathon_gradio/anam_education/Dockerfile.cloudrun \
          .

  - name: "gcr.io/cloud-builders/docker:latest"
    id: "push"
    entrypoint: "bash"
    args: ["-c", "docker push $_IMAGE_URL"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    id: "deploy-cloud-run"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "gemini-hackathon-anam-education"
      - "--project=$PROJECT_ID"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--image=$_IMAGE_URL"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--timeout=300"
      - "--concurrency=40"
      - "--min-instances=0"
      - "--max-instances=5"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--set-env-vars=MODEL_PROFILE=hackathon,GEMINI_BACKEND=vertex,GOOGLE_CLOUD_LOCATION=$_REGION"
      - "--set-secrets=GEMINI_API_KEY=projects/$PROJECT_ID/secrets/GEMINI_API_KEY:latest"

substitutions:
  _REGION: europe-west1
  _IMAGE_URL: ""

timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
