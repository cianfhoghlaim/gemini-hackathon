[project]
name = "journey-level-0-pick-subnation"
version = "0.1.0"
description = "British Isles Journey — Level 0: pick your subnation + onboard"
requires-python = ">=3.11"

dependencies = [
    "gradio>=5.28.0,<6.0",
    "google-cloud-firestore>=2.19",
    "google-adk>=2.7.1,<3.0",
    "gemini-hackathon",
]

[tool.uv.sources]
gemini-hackathon = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
