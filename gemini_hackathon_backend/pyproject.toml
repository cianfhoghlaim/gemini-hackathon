[project]
name = "gemini-hackathon-backend"
version = "0.1.0"
description = "ADK 2 FastAPI backend for the British Isles Journey. Hosts the AG-UI bridge + A2UI JSONL streaming."
requires-python = ">=3.11"

dependencies = [
    # ADK + Gemini (matches what's already pinned in ../pyproject.toml)
    "google-adk>=2.7.1,<3.0",
    "google-genai",
    # AG-UI bridge (the new dependency for the journey)
    "ag-ui-adk",
    # Web framework
    "fastapi",
    "uvicorn[standard]",
    # State (Phase 6 abstractions — reuse, don't re-implement)
    "google-cloud-firestore",
    # Embeddings (matches the journey's existing VertexEmbedder)
    "google-cloud-aiplatform",
    "google-cloud-storage",
    # Config
    "python-dotenv",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gemini_hackathon_backend"]
