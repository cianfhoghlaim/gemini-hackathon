  required: false

gemini-hackathon-document-ai-processor-id:
  gsm_secret_id: gemini-hackathon-document-ai-processor-id
  env_var: DOCUMENT_AI_PROCESSOR_ID
  description: Document AI processor resource ID (Layout Parser)
  required: false

