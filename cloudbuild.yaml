# Cloud Build pipeline for the gemini_hackathon Python backend.
#
# Build + push to Artifact Registry + deploy to Cloud Run.
# All secrets are pulled from Secret Manager at deploy time — never
# baked into the image.
#
# Submit:
#   gcloud builds submit --config=cloudbuild.yaml \
#       --project=$GCP_PROJECT \
#       --substitutions=_REGION=europe-west1,_REPO=$GCP_PROJECT/gemini-hackathon

steps:
  # 0. Build the Python backend image (multi-stage; uv for dependency
  #    resolution + baml-cli generate; runtime image is python:3.11-slim).
  - name: "gcr.io/cloud-builders/docker:latest"
    id: "build"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        # Enable BuildKit for --mount=type=cache syntax (uv's cache mount)
        export DOCKER_BUILDKIT=1
        docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t "$_IMAGE_URL" \
          -f Dockerfile \
          .

  # 1. Push to Artifact Registry.
  - name: "gcr.io/cloud-builders/docker:latest"
    id: "push"
    entrypoint: "bash"
    args: ["-c", "docker push $_IMAGE_URL"]

  # 2. Deploy to Cloud Run. Env vars + secret refs.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:latest"
    id: "deploy-cloud-run"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "$_IMAGE_URL"
      - "--project=${PROJECT_ID}"
      - "--region=$_REGION"
      - "--platform=managed"
      - "--service=gemini-hackathon"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--timeout=300"
      - "--concurrency=80"
      - "--min-instances=1"
      - "--max-instances=10"
      - "--allow-unauthenticated"
      - "--set-env-vars=MODEL_PROFILE=hackathon,GEMINI_BACKEND=vertex,GOOGLE_CLOUD_LOCATION=$_REGION,PYTHONUNBUFFERED=1"
      # Secret refs MUST match gsm_secret_id (lowercase, hyphens) in secrets.yaml.
      # GEMINI_API_KEY omitted because GEMINI_BACKEND=vertex uses ADC (no key needed).
      - "--set-secrets=UNSLOTH_API_KEY=projects/${PROJECT_ID}/secrets/unsloth-api-key:latest,UNSLOTH_BASE_URL=projects/${PROJECT_ID}/secrets/unsloth-base-url:latest"

substitutions:
  _REGION: europe-west1

images:
  - "$_IMAGE_URL"

timeout: "1800s"

options:
  logging: CLOUD_LOGGING_ONLY
