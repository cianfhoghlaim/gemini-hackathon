name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.x"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

# The canonical task runner for this repo is the `Makefile` (the
# `2026-08-31-replace-mise-with-make-v1` openspec change removed
# `mise.toml`). The CI workflow runs the same targets that `make verify`
# invokes locally — see scripts/verify.sh for the 8-tick gate.

jobs:
  # ---------------------------------------------------------------------------
  # lint — Ruff (modern ruff = ruff check + ruff format)
  # ---------------------------------------------------------------------------
  lint:
    name: ruff (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # typecheck — mypy strict mode (dignified-python-312)
  # ---------------------------------------------------------------------------
  typecheck:
    name: mypy (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Generate BAML client
        run: uv run baml-cli generate

      - name: mypy gemini_hackathon/
        run: uv run mypy gemini_hackathon/

  # ---------------------------------------------------------------------------
  # test — pytest with coverage
  # ---------------------------------------------------------------------------
  test:
    name: pytest (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Generate BAML client
        run: uv run baml-cli generate

      - name: pytest (with coverage)
        run: uv run pytest tests/ -v --cov=gemini_hackathon --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # baml-test — BAML extraction function smoke tests
  # Runs after the typecheck + test jobs in the same matrix, but uses a
  # separate runner because baml-cli test spins up its own LLM fixtures.
  # ---------------------------------------------------------------------------
  baml-test:
    name: baml-cli test (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (with baml[testing])
        run: uv sync --all-groups --python 3.12

      - name: baml-cli test
        env:
          BAML_TEST_MODE: "true"
          OPENAI_API_KEY: "sk-fake-test-key-for-baml-cli"
        run: uv run baml-cli test