# ============================================================================
# docker-compose.yml — local development stack for gemini-hackathon.
#
#  - gemini-hackathon : the application (builds from Dockerfile)
#  - ollama           : serves unsloth/gemma-4-26B-A4B-it-GGUF locally
#  - duckdb           : a named volume that holds the .duckdb file (so the
#                       app + any marimo notebook share the same data)
#
# Usage:
#   docker compose up --build
#   docker compose down -v         # wipe the duckdb volume
# ============================================================================

name: gemini-hackathon

services:
  gemini-hackathon:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: gemini-hackathon:dev
    container_name: gemini-hackathon-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UNSLOTH_BASE_URL: http://ollama:11434/v1
      UNSLOTH_MODEL: ${UNSLOTH_MODEL:-unsloth/gemma-4-26B-A4B-it-GGUF}
      UNSLOTH_API_KEY: ${UNSLOTH_API_KEY:-ollama}
      DUCKDB_PATH: /app/data/gemini.duckdb
    volumes:
      - duckdb-data:/app/data
      - gemini-themes:/app/themes
      - gemini-cache:/app/.cache
      # Mount the source for live reload in dev (comment out for prod builds):
      - ./gemini_hackathon:/app/gemini_hackathon:ro
      - ./baml_extracts:/app/baml_extracts:ro
      - ./dlt_pipelines:/app/dlt_pipelines:ro
    ports:
      - "8080:8080"
    depends_on:
      ollama:
        condition: service_started
    networks:
      - gh-net

  # ---------------------------------------------------------------------------
  # Local Unsloth / Ollama-compatible inference server
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: gemini-hackathon-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    # GPU passthrough — uncomment on a Linux host with an NVIDIA GPU:
    #   deploy:
    #     resources:
    #       reservations:
    #         devices:
    #           - driver: nvidia
    #             count: all
    #             capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - gh-net

  # ---------------------------------------------------------------------------
  # DuckDB file storage
  # (a real DuckDB instance does not exist as a service — the app owns the
  # .duckdb file. This service exists only to declare the named volume so
  # any other compose-attached notebook or CLI tool can mount the same data.)
  # ---------------------------------------------------------------------------
  duckdb:
    image: alpine:3.20
    container_name: gemini-hackathon-duckdb
    command: ["sh", "-c", "echo 'DuckDB volume mount point — do not delete.' && tail -f /dev/null"]
    volumes:
      - duckdb-data:/data
    networks:
      - gh-net

volumes:
  duckdb-data:
    name: gemini-hackathon-duckdb-data
  gemini-themes:
    name: gemini-hackathon-themes
  gemini-cache:
    name: gemini-hackathon-cache
  ollama-models:
    name: gemini-hackathon-ollama-models

networks:
  gh-net:
    name: gemini-hackathon-net
    driver: bridge