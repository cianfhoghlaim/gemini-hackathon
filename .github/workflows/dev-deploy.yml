# Cloud Build trigger for the dev Cloud Run deployment.
#
# This workflow triggers a Cloud Build on every push to main, deploying
# the backend to the dev Cloud Run service (`gemini-hackathon-adk-dev`).
# Production deployments are NOT triggered by this workflow; they require
# a tagged release.
#
# Required GitHub Actions secrets (see AGENTS.md):
#   GCP_PROJECT_ID                GCP project ID
#   GCP_SA_KEY_DEV                 service account JSON key with
#                                  roles/run.developer + roles/cloudbuild.builds.editor
#   LANGFUSE_PUBLIC_KEY_DEV        Langfuse public key (dev instance)
#   LANGFUSE_SECRET_KEY_DEV        Langfuse secret key (dev instance)
name: dev-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dev-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}

      - name: Set up Cloud Build
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --substitutions=_IMAGE_URL="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/gemini-hackathon/adk:${{ github.sha }}",_REGION=europe-west1,_SERVICE_NAME=gemini-hackathon-adk-dev

      - name: Verify healthz
        run: |
          sleep 30
          URL=$(gcloud run services describe gemini-hackathon-adk-dev \
            --region=europe-west1 --project="${{ secrets.GCP_PROJECT_ID }}" \
            --format="value(status.url)")
          curl -fsS "${URL}/healthz" | jq .
