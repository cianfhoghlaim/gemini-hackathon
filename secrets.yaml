# =============================================================================
# gemini_hackathon — Google Cloud Secret Manager ID catalogue
# =============================================================================
# Committed. PLAINTEXT: NEVER.
# Each entry maps an env-var name (consumed by the application) to a
# Google Cloud Secret Manager secret ID under the project
# `agentic-hackathon-august-26`.
#
# Resolution contract:
#   - In production (Cloud Run / GCE / GKE): use ADC + the Python SDK
#     via `gemini_hackathon/secrets_loader.py` (no env file needed).
#   - In local dev: set `ADK_LOCAL_SECRETS=1` and read from `.env`
#     (gitignored).
#
# Add a new secret:
#   1. Append the env-var name + the desired GSM secret_id below.
#   2. Run `uv run python scripts/seed_gsm.py` to create + populate it.
#   3. Run `uv run python scripts/audit_gsm.py` to verify parity.
# =============================================================================

project: agentic-hackathon-august-26

# ----- Tier 1: Gemini 3.5 Flash (Vertex + AI Studio) ----------------------
gemini-api-key:
  gsm_secret_id: gemini-api-key
  env_var: GEMINI_API_KEY
  description: Google AI Studio API key (used when GEMINI_BACKEND=aistudio)
  required: true

google-credentials:
  gsm_secret_id: google-application-credentials-json
  env_var: GOOGLE_APPLICATION_CREDENTIALS_JSON
  description: Service account JSON content (inline; populated to /tmp/sa.json at runtime when ADK_LOCAL_SECRETS != 1)
  required: false

# ----- Tier 2: Gemma 4 26B-A4B via Unsloth Studio ------------------------
unsloth-api-key:
  gsm_secret_id: unsloth-api-key
  env_var: UNSLOTH_API_KEY
  description: Unsloth Studio OpenAI-compatible API key (sk-unsloth-...)
  required: true

# ----- LLM gateway (LiteLLM on localhost:4000) ----------------------------
litellm-master-key:
  gsm_secret_id: litellm-master-key
  env_var: LITELLM_MASTER_KEY
  description: LiteLLM proxy master key (sk-litellm-master-...)
  required: true

litellm-salt-key:
  gsm_secret_id: litellm-salt-key
  env_var: LITELLM_SALT_KEY
  description: LiteLLM salt key for credential hashing
  required: true

opencode-go-api-key:
  gsm_secret_id: opencode-go-api-key
  env_var: OPENCODE_GO_API_KEY
  description: OpenCode Go Zen primary API key
  required: true

huggingface-token:
  gsm_secret_id: huggingface-token
  env_var: HF_TOKEN
  description: HuggingFace Hub read+write token
  required: true

# ----- Cloud providers (optional, for cross-cutting routes) ---------------
openai-api-key:
  gsm_secret_id: openai-api-key
  env_var: OPENAI_API_KEY
  required: false

anthropic-api-key:
  gsm_secret_id: anthropic-api-key
  env_var: ANTHROPIC_API_KEY
  required: false

deepseek-api-key:
  gsm_secret_id: deepseek-api-key
  env_var: DEEPSEEK_API_KEY
  required: false

# ----- Observability stack --------------------------------------------------
langfuse-public-key:
  gsm_secret_id: langfuse-public-key
  env_var: LANGFUSE_PUBLIC_KEY
  required: true

langfuse-secret-key:
  gsm_secret_id: langfuse-secret-key
  env_var: LANGFUSE_SECRET_KEY
  required: true

mlflow-tracking-uri:
  gsm_secret_id: mlflow-tracking-uri
  env_var: MLFLOW_TRACKING_URI
  description: Default to http://localhost:5000 for local dev
  required: false

# ----- Web search + scrape --------------------------------------------------
firecrawl-api-key:
  gsm_secret_id: firecrawl-api-key
  env_var: FIRECRAWL_API_KEY
  required: false

# ----- Memory services ------------------------------------------------------
letta-api-key:
  gsm_secret_id: letta-api-key
  env_var: LETTA_API_KEY
  required: false

# ============================================================================
# Phase 6 (2026-08-31) — env-var documentation parity
# ============================================================================
# Each entry below was referenced by code but missing from .env.example;
# added per the openspec change `2026-08-31-phase-6-polish-v1`. All set
# `required: false` since dev defaults work without these (the canonical
# `.env` blocks `= true` / `= http://localhost:5000` style defaults).

# ----- Build / deploy -------------------------------------------------------
gemini-hackathon-commit-sha:
  gsm_secret_id: gemini-hackathon-commit-sha
  env_var: COMMIT_SHA
  description: Source commit SHA at deploy time
  required: false

gemini-hackathon-deployed-agent-engine-id:
  gsm_secret_id: gemini-hackathon-deployed-agent-engine-id
  env_var: DEPLOYED_AGENT_ENGINE_ID
  description: ADK deployed Agent Engine ID
  required: false

gemini-hackathon-gemma-vertex-endpoint-id:
  gsm_secret_id: gemini-hackathon-gemma-vertex-endpoint-id
  env_var: GEMMA_VERTEX_ENDPOINT_ID
  description: Vertex AI Model Garden endpoint for the Gemma 4 OCR/VLM path
  required: false

gemini-hackathon-gcp-project:
  gsm_secret_id: gemini-hackathon-gcp-project
  env_var: GCP_PROJECT
  description: GCP project ID (alias for GOOGLE_CLOUD_PROJECT in some call sites)
  required: false

# ----- Document AI (OCR ensemble Path 1) -----------------------------------
gemini-hackathon-document-ai-location:
  gsm_secret_id: gemini-hackathon-document-ai-location
  env_var: DOCUMENT_AI_LOCATION
