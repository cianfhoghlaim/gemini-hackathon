[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-hackathon"
version = "0.1.0"
description = "BIEP Hackathon v3: theming-only Python package for the Google All-Things-Agentic hackathon"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Cian Mac An Deise", email = "cian@example.com" },
]
keywords = [
    "hackathon",
    "gemini",
    "agentic",
    "theming",
    "education",
    "british-isles-curriculum",
    "baml",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # ADK 2 agent runtime (the canonical agent framework)
    # Pinned to 2.7.x — the version support-memory-lab verifies against.
    # 2.5.0+ brings `mode="task"` as a graph node; 2.7.0+ brings
    # Memory Bank integration, ResumabilityConfig, RequestInput interrupt,
    # parallel_worker, recursive ctx.run_node.
    "google-adk>=2.7.1,<3.0",
    # Gradio 5.28+ for gr.Workflow (editorial canvas), gr.mcp (Spaces-as-MCP),
    # ZeroGPU (@spaces.GPU), server-side rendering.
    "gradio>=6.0,<7.0",
    # Plotly — the renderer behind 3 of the 4 an_learning_graph studio tabs
    # (Render / Equivalencies / Pedagogy overlay). Without it those tabs
    # silently build zero components.
    "plotly>=5.0",
    # HuggingFace Hub — for gradio_client + the `hf` CLI + hf skills add
    "huggingface_hub>=0.30",
    # FastMCP for the per-subject MCP servers
    "fastmcp>=0.4",
    # Data ingestion (DLT + DuckDB — the offline dev default)
    "dlt[bigquery]>=1.0,<2.0",
    "duckdb>=1.0",
    "ibis-framework[duckdb]>=9.0",
    # LLM routing + extraction (BAML + LiteLLM)
    "baml-py>=0.223.0",
    "litellm>=1.50",
    # GCP-first data + AI substrate (Phases 1-6 of the GCP-first refactor).
    # The 3 client libs (`google-cloud-bigquery`, `google-cloud-aiplatform`,
    # `google-cloud-storage`) are listed in the optional `[dependency-groups]
    # gcp` group below so a fully-offline dev install doesn't need them. The
    # runtime imports are wrapped in `try/except ImportError` throughout
    # `dlt_pipelines/` and `cocoindex_flows/` so the modules stay importable
    # even when the group isn't installed.
    # Vector + graph — Firestore FindNearest is the default VectorTarget;
    # LanceDB + FalkorDB kept as optional local cianfhoghlaim-parity backends
    # (see `[dependency-groups] cianfhoghlaim-parity` below).
    "networkx>=3.0",
    # `numpy.typing.NDArray` is imported directly by several CocoIndex
    # embedding chunk dataclasses (cross_subject_competency_embedding.py,
    # junior_cycle_embedding.py) — was previously an undeclared transitive
    # dependency.
    "numpy>=1.26",
    # Observability (structlog always-on; Langfuse/MLflow optional exporters
    # gated behind env vars — see `gemini_hackathon/observability.py`)
    "structlog>=24.0",
    # Agent memory is now env-gated between VertexAiMemoryBankService
    # (production) and MarkdownMemoryService (dev/offline fallback) — see
    # `gemini_hackathon_backend/agents/memory.py:build_memory_service()`.
    # The Letta dependency was removed in the 2026-08-30 Phase 0 change.
    # Web scraping + PDF
    "firecrawl-py>=1.0",
    "pypdf>=4.0",
    # PDF rendering (for OCR + image extraction)
    "pypdfium2>=4.0",
    "pillow>=10.0",
    # Reactive notebooks
    "marimo>=0.10",
    # Auth (Phase 2 fleet_identity)
    "pyjwt>=2.8",
    # Schemas
    "pydantic>=2.0",
    "zod>=0.0.1; sys_platform == 'never'",  # placeholder; Zod lives in TS
    # HTTP
    "httpx>=0.27",
    "requests>=2.31",
    # Settings
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
gemini-hackathon = "gemini_hackathon.cli:main"

[project.urls]
Repository = "https://github.com/cianfhoghlaim/gemini-hackathon"
Documentation = "https://cianfhoghlaim.github.io/gemini-hackathon"
"BAML reference" = "https://docs.boundaryml.com"

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735) — canonical 2026 uv convention
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-Pillow",
    "types-requests",
    "baml-py[testing]>=0.223.0",
    # For the W12 Cloud Run deploy + W13 HF Spaces deploy
    "google-cloud-build>=3.24",
    "google-cloud-run>=0.10",
    "huggingface-hub[cli]>=0.30",
    # GSM secrets loader (scripts/seed_gsm.py + scripts/audit_gsm.py)
    "google-cloud-secret-manager>=2.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]
# Phase 2 (2026-08-31-gcp-data-plane-v1) — the GCP data-plane client
# libraries. Install with `uv sync --group gcp` for the GCP-backed
# data plane (BigQuery + Vertex AI Vector Search + GCS); the default
# `uv sync` install is local-only (DuckDB + LanceDB).
#
# All GCP imports in `dlt_pipelines/` + `cocoindex_flows/` are wrapped
# in `try/except ImportError` graceful-degrade so the package remains
# importable when this group isn't installed — the GCP-backed paths
# return empty results / log warnings instead of crashing.
gcp = [
    "google-cloud-bigquery>=3.0",         # Phase 2 — DLT BigQuery destination
    "google-cloud-aiplatform>=1.50",      # Phase 2 — Vertex AI Vector Search
    "google-cloud-storage>=2.10",         # Phase 2 — GCS PDF corpus substrate
    # Phase 0/1 — already-imported GCP client libs (kept in the same
    # opt-in group so the default `uv sync` doesn't pull any GCP deps).
    "google-cloud-firestore>=2.19",
    "google-cloud-documentai>=2.30",      # OCR ensemble path 1
    "google-cloud-workflows>=1.16",
    "google-cloud-scheduler>=2.13",
    "google-cloud-pubsub>=2.23",
    "google-cloud-trace>=1.13",
    "google-cloud-logging>=3.11",
]
docs = [
    "marimo>=0.10",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
lint = [
    "ruff>=0.6",
]
# Optional local cianfhoghlaim-parity stack. NOT installed by default (the
# GCP-first refactor replaced these with Firestore / Vertex AI Vector
# Search / BigQuery / Document AI as the deployed-path default — see
# `docs/ARCHITECTURE.md` section 7). Install with
# `uv sync --group cianfhoghlaim-parity` to run the self-hosted lakehouse
# stack locally (`bonneagar/stacks/lakehouse`) instead.
# NOTE: `ducklake>=0.10` is unresolvable as of 2026-08 (PyPI only ships up
# to 0.1.1) — pinned to the highest real release.
# NOTE: `motherduck>=0.10` is unresolvable as of 2026-08 (PyPI only ships 0.0.0).
# MotherDuck is accessed via `duckdb.connect("md:motherduck")` (the DuckDB
# extension), not a separate pip package. Removed from this optional group.
cianfhoghlaim-parity = [
    "ducklake<=0.1.1",
    "lancedb>=0.10",
    # Phase 0 (GCP-first IaC refactor) — Lance namespace SDK.
    # The vector target wrapper in cocoindex_flows/_shared/_vector_target.py
    # reads LANCE_NAMESPACE_BACKEND to switch between the in-process
    # LanceDB write (backward compat) and the new namespace-driven write.
    "lance-namespace>=0.4",
    "pylance>=0.10",
    "falkordb>=1.0",
    "graphiti-core>=0.20",
    "cognee>=0.2",
    "langfuse>=3.0",
    "mlflow>=2.20",
    # Phase 1 (local data plane) — CocoIndex v1 + the
    # SentenceTransformerEmbedder that powers the `EMBED_BACKEND=
    # sentence_transformers` offline fallback path
    # (cocoindex_flows/_shared/_lifespan.py:53-69). Without these the
    # CocoIndex Apps degrade to "unavailable" stubs and `make
    # cocoindex-update` is a graceful no-op (the test in
    # tests/cocoindex/test_lancedb_local_mode.py is `@pytest.mark.integration`
    # and skips when these aren't installed).
    "cocoindex>=1.0,<2.0,!=1.0.8",
    "sentence-transformers>=3.0,<7.0",
]

# ---------------------------------------------------------------------------
# Hatchling build config
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = [
    "gemini_hackathon",
    "gemini_hackathon_gradio",
    "gemini_hackathon_assets_fibo",
]
include = [
    "gemini_hackathon/py.typed",
    "gemini_hackathon_gradio/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "gemini_hackathon",
    "gemini_hackathon_gradio",
    "gemini_hackathon_assets_fibo",
    "themes",
    "baml_extracts",
    "baml_extracts_education",
    "baml_extracts_university",
    "data/ireland/ncca_policy",
    "data/leabharlann",
    "README.md",
    "LICENSE",
]

# ---------------------------------------------------------------------------
# uv config — modern 2026 conventions
# ---------------------------------------------------------------------------

[tool.uv]
default-groups = ["dev", "docs", "lint"]
managed = true
package = true

[tool.uv.pip]
extra-index-url = ["https://pypi.org/simple"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["gemini_hackathon", "tests"]

[tool.ruff.lint]
# Dignified-Python-312 aware: E/F/W (pycodestyle/pyflakes), I (isort),
# N (pep8-naming), UP (pyupgrade), B (bugbear), A (builtins),
# C4 (comprehensions), SIM (simplify), RUF (ruff-specific)
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "RET", "PL"]
ignore = [
    "E501",  # line-too-long (formatter handles)
    "B008",  # function call in default argument — common in Pydantic
    "PLR0913", # too-many-arguments — explicit > implicit in agent tool signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "PT004"]
"baml_extracts/**/*.py" = ["TID252"]

[tool.ruff.lint.isort]
known-first-party = ["gemini_hackathon"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict mode (dignified-python-312)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
# BAML generated client + third-party agent libs lack inline type stubs
module = [
    "baml_client.*",
    "litellm.*",
    "firecrawl.*",
    "langfuse.*",
    "motherduck.*",
    "google.adk.*",
    "gradio.*",
    "fastmcp.*",
    "huggingface_hub.*",
    "lancedb.*",
    "falkordb.*",
    "graphiti_core.*",
    "cognee.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests can be looser
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "-q", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:baml_client.*",
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:google.adk.*",
    "ignore::DeprecationWarning:google.adk.agents.base_agent_config.*",
    "ignore::DeprecationWarning:typing_extensions.*",
    "ignore::DeprecationWarning:baml_client.*",
    # Vertex AI GenerativeModel — deprecated upstream June 2025 (kept here as a
    # soft-deprecation warning). Tests that mock the model surface still
    # trigger the deprecation warning at GenerativeModel instantiation time.
    "ignore::UserWarning:vertexai.generative_models.*",
    "ignore::UserWarning:vertexai._utils.warning_logs",
    # Unclosed-socket warnings — emitted when fixture-cleanup races with
    # GC of connection objects from prior tests. The fixture lifecycle
    # is a runtime concern, not a test contract.
    "ignore::ResourceWarning",
]

# ---------------------------------------------------------------------------
# Coverage (optional but useful for CI badge)
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["gemini_hackathon"]
omit = ["tests/*", "**/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 70